<section class="cita-seccion">
    <div class="contenedor-cita">
        
        <div class="cita-encabezado">
            <h2>Agenda tu Cita</h2>
            <p>Elige el día y la hora que mejor te convenga para recibir asesoría personalizada sobre tu vivienda o crédito.</p>
        </div>

        <div class="tarjeta-formulario">
            <form id="formRegistroCita" class="formulario-cita">
                
                <div class="grupo-campo">
                    <label for="nombreCompleto"><i class="fa-solid fa-user"></i> Nombre completo</label>
                    <input type="text" id="nombreCompleto" name="nombre" placeholder="Ej. Ana López" required>
                </div>

                <div class="grid-dos-columnas">
                    <div class="grupo-campo">
                        <label for="telefonoCliente"><i class="fa-solid fa-phone"></i> Teléfono (WhatsApp)</label>
                        <input type="tel" id="telefonoCliente" name="telefono" placeholder="Ej. 669 123 4567" required>
                    </div>

                    <div class="grupo-campo">
                        <label for="correoCliente"><i class="fa-solid fa-envelope"></i> Correo electrónico</label>
                        <input type="email" id="correoCliente" name="correo" placeholder="correo@ejemplo.com" required>
                    </div>
                </div>

                <div class="grid-dos-columnas">
                    <div class="grupo-campo">
                        <label for="tipoCredito"><i class="fa-solid fa-building-columns"></i> Tipo de Crédito de Interés</label>
                        <select id="tipoCredito" name="credito" required>
                            <option value="" disabled selected>Selecciona una opción</option>
                            <option value="Infonavit">Infonavit</option>
                            <option value="Fovissste">Fovissste</option>
                            <option value="Bancario">Crédito Bancario</option>
                            <option value="Contado">Pago de Contado</option>
                            <option value="Otro">Otro / Requiero Asesoría</option>
                        </select>
                    </div>

                    <div class="grupo-campo">
                        <label for="tipoVivienda"><i class="fa-solid fa-house"></i> Interés de Vivienda</label>
                        <select id="tipoVivienda" name="vivienda">
                            <option value="" disabled selected>Selecciona la opción</option>
                            <option value="Casa">Casa</option>
                            <option value="Departamento">Departamento</option>
                        </select>
                    </div>
                </div>

                <div class="grid-dos-columnas">
                    <div class="grupo-campo">
                        <label for="fechaCita"><i class="fa-solid fa-calendar-days"></i> Fecha de la cita</label>
                        <input type="date" id="fechaCita" name="fecha" required>
                    </div>

                    <div class="grupo-campo">
                        <label for="horaCita"><i class="fa-solid fa-clock"></i> Hora sugerida</label>
                        <input type="time" id="horaCita" name="hora" required>
                    </div>
                </div>

                <div class="grupo-campo">
                    <label for="notasCliente"><i class="fa-solid fa-comment-dots"></i> Comentarios o dudas (Opcional)</label>
                    <textarea id="notasCliente" name="notas" rows="3" placeholder="¿Tienes alguna duda específica sobre la ubicación, puntos o requisitos?"></textarea>
                </div>

                <button type="submit" class="btn-agendar"><i class="fa-solid fa-calendar-check"></i> Confirmar y Agendar Cita</button>
            </form>
        </div>

    </div>
</section>
